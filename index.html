<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BDM Pet Calculator</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Decode the path encoded by 404.html and restore it via history.replaceState
      // so React Router sees the correct URL on first load.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p !== null) {
          var base = '/bdm-pet-calc';
          var q = params.get('q');
          var url = base + '/' + p + (q ? '?' + q : '') + window.location.hash;
          window.history.replaceState(null, '', url);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
